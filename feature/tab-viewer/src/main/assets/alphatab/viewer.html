<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Tablaturas</title>
<style>
  :root { --sheet: #ffffff; --accent: #5b3fd1; --accent-soft: rgba(91, 63, 209, 0.10); }
  html, body { margin: 0; height: 100%; background: var(--sheet); }
  #viewport { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  /* Margen inferior para que la última línea pueda quedar por encima de la barra de pantalla completa. */
  #score { padding: 8px 0 88px; }
  .at-cursor-bar { background: var(--accent-soft); }
  .at-cursor-beat { background: var(--accent); width: 3px; }
  .at-highlight * { fill: var(--accent); stroke: var(--accent); }
</style>
</head>
<body>
<div id="viewport"><div id="score"></div></div>
<script src="alphaTab.min.js"></script>
<script src="bridge.js"></script>
</body>
</html>
